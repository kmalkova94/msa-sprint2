stages:
  - build
  - test
  - deploy-dependencies
  - deploy
  - tag

variables:
  IMAGE_TAG: latest
  IMAGE_NAME: booking-service
  HELM_CHART_DIR: helm/booking-service

before_script:
  - echo "Starting pipeline for ${IMAGE_NAME}"
  - minikube status || minikube start --driver=docker

build:
  stage: build
  script:
    - cd ../../../../microservices/booking-service
    - docker build -t ${IMAGE_NAME} .
    - docker tag ${IMAGE_NAME} ${IMAGE_NAME}:${IMAGE_TAG}
  artifacts:
    paths:
      - booking-service/build/libs/*.jar


test:
  stage: test
  script:

    - docker network create hotelio-net || true
    - docker compose up -d booking-service booking-service-db zookeeper kafka
    - sleep 50
    - curl -f http://localhost:8082/api/ping
    - curl -f http://localhost:8082/api/ready
    - docker compose down

deploy-dependencies:
  stage: deploy-dependencies
  script:
    - echo "Deploying dependencies to Minikube..."

    # Deploy PostgreSQL
    - kubectl apply -f helm/postgres/pvc.yaml
    - kubectl apply -f helm/postgres/service.yaml
    - kubectl apply -f helm/postgres/deployment.yaml

    # Deploy Kafka and Zookeeper
    - kubectl apply -f helm/kafka/zookeeper-service.yaml
    - kubectl apply -f helm/kafka/zookeeper-deployment.yaml
    - sleep 50
    - kubectl apply -f helm/kafka/kafka-service.yaml
    - kubectl apply -f helm/kafka/kafka-deployment.yaml

    # Wait for dependencies to be ready
    - kubectl wait --for=condition=available --timeout=120s deployment/booking-service-db
    - kubectl wait --for=condition=available --timeout=120s deployment/zookeeper
    - kubectl wait --for=condition=available --timeout=300s deployment/kafka

  only:
    - main

deploy:
  stage: deploy
  script:
    - minikube image load ${IMAGE_NAME}:latest
    - helm upgrade --install booking-service ${HELM_CHART_DIR} -f ${HELM_CHART_DIR}/values-staging.yaml
  environment:
    name: staging
    url: http://booking-service.local

tag:
  stage: tag
  script:
    - git tag "deploy-$(date +%Y%m%d-%H%M%S)"
    - echo "Tag created successfully"
  only:
    - main
 