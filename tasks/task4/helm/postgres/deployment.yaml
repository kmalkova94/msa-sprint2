apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service-db
  template:
    metadata:
      labels:
        app: booking-service-db
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "booking"
            - name: POSTGRES_USER
              value: "booking"
            - name: POSTGRES_PASSWORD
              value: "booking"
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: booking-service-db-pvc